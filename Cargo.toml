[workspace]
resolver = "3"
members = ["./crates/sbv2_api", "./crates/sbv2_core", "./crates/sbv2_bindings", "./crates/sbv2_wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
description = "Style-Bert-VITSの推論ライブラリ"
license = "MIT"
readme = "./README.md"
repository = "https://github.com/neodyland/sbv2-api"
documentation = "https://docs.rs/sbv2_core"

[workspace.dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
env_logger = "0.11.6"
ndarray = "0.17.1"
once_cell = "1.20.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# jpreprocess の空品詞/壊れた辞書エントリで g2p が 500 になる問題の修正。
# core だけを fork(kazu/jpreprocess)に差し替える。jpreprocess / jpreprocess-naist-jdic
# 等は crates.io のまま(= 辞書は crates.io の prebuilt を維持)で、patched core に対して
# 再コンパイルされる。空/未知の品詞は 名詞,一般 へ、CType/CForm/Pronunciation は Default へ
# フォールバックして合成を止めない。詳細は fork のコミット参照。
[patch.crates-io]
jpreprocess-core = { git = "https://github.com/kazu/jpreprocess", branch = "default-pos-fallback" }
