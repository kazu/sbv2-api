[workspace]
resolver = "3"
members = ["./crates/sbv2_api", "./crates/sbv2_core", "./crates/sbv2_bindings", "./crates/sbv2_wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
description = "Style-Bert-VITSの推論ライブラリ"
license = "MIT"
readme = "./README.md"
repository = "https://github.com/neodyland/sbv2-api"
documentation = "https://docs.rs/sbv2_core"

[workspace.dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
env_logger = "0.11.6"
ndarray = "0.17.1"
once_cell = "1.20.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# 注: 以前あった jpreprocess-core の [patch.crates-io] は撤回した。
# あれは「空品詞で 500」を握りつぶす修正だったが、真因は jpreprocess のバグではなく、
# HF 配布の user 辞書 all.bin が jpreprocess の lindera(1.4.1) と別バージョンの lindera で
# 焼かれていて features が読めない(全部化ける)ことだった。握りつぶすと化けた読みを音にする。
# 正しい直し = all.bin を lindera 1.4.1 で焼き直したものに差し替える(Dockerfile 参照)。
# よって jpreprocess は stock(0.13.2)のまま使う。
